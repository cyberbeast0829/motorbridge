[package]
name = "motor_vendor_cyberbeast"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "motor_vendor_cyberbeast"
path = "src/lib.rs"

[dependencies]
motor_core = { path = "../../motor_core" }
# The device's endpoint descriptor (protocol 4.8) is JSON: parse it with a real
# parser instead of hand-rolling one.
serde_json = "1"

[dev-dependencies]
motor_core = { path = "../../motor_core", features = ["test-support"] }
